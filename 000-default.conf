<VirtualHost *:8080>
  ServerAdmin rknop@pobox.com
  DocumentRoot /www/html

  WSGIScriptAlias / /django/desidb/desidb/wsgi.py

  <Directory /django/desidb/desidb>
    <Files wsgi.py>
       Require all granted
    </Files>
  </Directory>

  ErrorLog ${APACHE_LOG_DIR}/error.log
  CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

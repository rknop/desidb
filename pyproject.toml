[project]
name = "desidb-rapidresponse"
description = "DESI Rapid Response Database"
authors = [ { name="Rob Knop" } ]
maintainers = [ { name="Rob Knop", email="raknop@lbl.gov" } ]
dynamic = [ "version" ]
requires-python = ">=3.11"

classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: PYthon"
]

dependencies = [
  "psycopg>=3.3.2,<4.0.0",
  "numpy>=2.3.5,<3.0.0",
  "astropy>=7.2.0,<8.0.0"
]

[project.urls]
repository = "https://github.com/rknop/desidb"

[build-system]
requires = [
  "setuptools>=62.1",
  "setuptools_scm[tomli]>6.2",
  "wheel"
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
namespaces = false
include = [ "desidb" ]

[tool.setuptools.dynamic]
version = { attr = "desidb.__version__" }

[tool.ruff]
line-length = 120
indent-width = 4
exclude = [
    ".git",
    ".github",
    ".ruff_cache",
    "__pypackages__",
]

[tool.ruff.lint]
preview = true
select = [ 'F', 'E101', 'E111', 'E112', 'E113', 'E115', 'E117',
           'E204', 'E223', 'E224', 'E242', 'E265', 'E273', 'E274', 'E275',
           'E301', 'E302', 'E305', 'E306', 'E401', 'E501', 'E502', 'E703',
           'E711', 'E713', 'E714', 'E72', 'E74',
           'W19', 'W29', 'W39', 'W605',
           'N804', 'N805', 'N807',
           'D206', 'D300', 'D301',
           'UP010', 'UP011', 'UP012', 'UP013', 'UP014', 'UP017', 'UP018', 'UP019',
           'UP02', 'UP030', 'UP031', 'UP033', 'UP034', 'UP035', 'UP036',
           'UP037', 'UP039', 'UP04',
           'PLE0100', 'PLE0101', 'PLE0116',
           'NPY',
           'RUF018',
           'E301', 'E302', 'E306', 'W505', 'D200', 'D212', 'RUF021' ]

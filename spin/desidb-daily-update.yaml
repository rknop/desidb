apiVersion: batch/v1
kind: CronJob
metadata:
  name: desidb-daily-update
  namespace: desidb
spec:
  concurrencyPolicy: Allow
  failedJobsHistoryLimit: 1
  jobTemplate:
    metadata:
      creationTimestamp: null
    spec:
      template:
        spec:
          containers:
          - command:
            - bash
            - /home/user/update_daily.sh
            env:
            - name: POSTGRES_NAME
              value: desidb
            - name: POSTGRES_PASSWORD_FILE
              value: /secrets/desidb_admin_postgres_password
            - name: POSTGRES_USER
              value: desidb_admin
            image: rknop/desidb-django
            imagePullPolicy: Always
            name: desidb-daily-update
            resources: {}
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                add:
                - NET_BIND_SERVICE
                drop:
                - ALL
              privileged: false
              readOnlyRootFilesystem: false
              runAsNonRoot: false
              runAsUser: 95089
            stdin: true
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
            tty: true
            volumeMounts:
            - mountPath: /data
              name: desi-data
            - mountPath: /django
              name: django-webap
            - mountPath: /secrets
              name: desidb-secrets
          dnsPolicy: ClusterFirst
          restartPolicy: Never
          schedulerName: default-scheduler
          securityContext:
            fsGroup: 58102
          terminationGracePeriodSeconds: 30
          volumes:
          - hostPath:
              path: /global/cfs/cdirs/desi/spectro/redux
              type: Directory
            name: desi-data
          - hostPath:
              path: /global/cfs/cdirs/desi/users/raknop/desidb/django
              type: Directory
            name: django-webap
          - name: desidb-secrets
            secret:
              defaultMode: 256
              optional: false
              secretName: desidb-secrets
  schedule: 0 2 * * *
  successfulJobsHistoryLimit: 3
  suspend: false
